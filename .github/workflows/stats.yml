name: stats

on:
  schedule:
    - cron: "17 3 * * *" # every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/stats.mjs", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg && [ -z "$(git status --porcelain assets/stats.svg)" ]; then exit 0; fi
          # A new image address on every update, so GitHub's image cache and the mobile app fetch the new card.
          stamp=$(date -u +%Y%m%d%H%M)
          sed -i -E "s#\./assets/stats\.svg(\?v=[0-9]+)?\"#./assets/stats.svg?v=${stamp}\"#" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg README.md
          git commit -m "Update stats"
          git push
